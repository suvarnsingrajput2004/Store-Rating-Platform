server {
    # PORT is injected at container startup via envsubst.
    # Default (set in Dockerfile ENV): 3000 — so local Docker Compose is unchanged.
    # On Railway: set PORT to whatever Railway assigns (Railway injects this automatically).
    listen ${PORT};
    server_name _;

    # --- Gzip compression for production ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --- Serve the React SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy API requests to the backend ---
    # NGINX_BACKEND_URL is injected at container startup via envsubst.
    # Default (set in Dockerfile ENV): http://backend:5000  (local Docker Compose network)
    # On Railway: set to https://<your-backend>.up.railway.app
    location /api/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --- Lightweight health check endpoint for Railway ---
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
